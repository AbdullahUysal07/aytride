name: Publish catalog price updates

on:
  push:
    branches: [main]
    paths:
      - data/public-catalog.json
      - .github/workflows/publish-catalog-prices.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-catalog-prices
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild generated multilingual site and backend catalog
        run: npm run build
      - name: Commit generated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate multilingual site with updated route prices"
            git push
          fi
