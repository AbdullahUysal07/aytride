name = "ayt-ride-api"
main = "server/worker.mjs"
compatibility_date = "2026-09-12"

routes = [
  { pattern = "aytride.com/api/*", zone_name = "aytride.com" },
  { pattern = "www.aytride.com/api/*", zone_name = "aytride.com" }
]

[[d1_databases]]
binding = "DB"
database_name = "ayt-ride-bookings"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
ALLOWED_ORIGINS = "https://aytride.com,https://www.aytride.com,https://abdullahuysal07.github.io"
BOOKING_EMAIL = "booking@aytride.com"
MAIL_FROM = "AYT Ride <booking@aytride.com>"
ADMIN_EMAILS = "admin@aytride.com"

# Replace these placeholders in data/public-catalog.json before paid ads:
# business.whatsapp = "90XXXXXXXXXX"
# business.displayWhatsapp = "+90 XXX XXX XX XX"
# analytics.gtmId = "GTM-XXXXXXX"
# analytics.ga4MeasurementId = "G-XXXXXXXXXX"
# analytics.googleAdsId = "AW-XXXXXXXXXX"
# analytics.googleAdsBookingLabel = "XXXXXXXXXX"

# Set these as Cloudflare secrets, not plaintext vars:
# RESEND_API_KEY
# ADMIN_PASSWORD_SALT
# ADMIN_PASSWORD_SHA256
# ADMIN_SESSION_SECRET
# PRIVATE_PRICING_JSON
